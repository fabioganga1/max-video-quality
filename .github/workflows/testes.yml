name: testes

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # o teste diferencial descarrega o hls.js real; guardar poupa a descarga
      - uses: actions/cache@v4
        with:
          path: tests/.cache
          key: hlsjs-1.5.14

      - run: node tests/run.js
